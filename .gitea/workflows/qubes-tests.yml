# Runs the Qubes integration tests on the bare-metal Qubes CI machine.
# Needs an act_runner with the label "qubes:host" and capacity 1, on the
# machine ci-ctl's reverse tunnel connects to. See ci/README.md.
name: qubes-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      system_tests:
        description: "Qubes test modules (module[:timeout] ...)"
        default: "qubes.tests.integ.basic qubes.tests.integ.vm_qrexec_gui:14400"

concurrency:
  group: qubes-ci-machine
  cancel-in-progress: false

jobs:
  qubes:
    runs-on: qubes
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4

      # REPLACE: however qubes-guix produces its template RPM(s).
      # Everything put in ci-payload/ is copied into dom0:
      #   *.rpm          installed with qvm-template and tested
      #   dom0-tests.sh  run in dom0 after the Qubes test modules (optional)
      - name: Build payload
        run: |
          mkdir -p ci-payload
          make template-rpm OUT=ci-payload
          cp ci/dom0-tests.sh ci-payload/ 2>/dev/null || true

      - name: Run tests on the Qubes machine
        env:
          SYSTEM_TESTS: ${{ inputs.system_tests || 'qubes.tests.integ.basic qubes.tests.integ.vm_qrexec_gui:14400' }}
        run: ci/runner/qubes-ci-run.sh ci-payload qubes-results

      - name: Keep results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: qubes-results
          path: qubes-results/
