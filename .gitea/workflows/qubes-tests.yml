# Builds the qubes-guix installer ISO at the pushed commit, then on the
# bare-metal Qubes CI machine installs a Guix template from it
# (qubes-guix-create --unattended --template --test) and smoke-tests it
# (qubes-guix-test).
#
# Needs an act_runner with the label "qubes:host" and capacity 1, on the
# machine ci-ctl's reverse tunnel connects to, with SSH access to the Guix
# build host (guix-subs), where the ISO is built. See ci/README.md.
name: qubes-tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      system_tests:
        description: "Also run these Qubes test modules on the template (module[:timeout] ...)"
        default: ""

concurrency:
  group: qubes-ci-machine
  cancel-in-progress: false

jobs:
  qubes:
    runs-on: qubes
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4

      # The ISO is built from the channel's public repository (GitHub), so
      # wait for the Gitea push mirror to get this commit there.
      - name: Wait for the mirror
        run: |
          url=$(sed -n 's/.*(url "\(.*\)").*/\1/p' guest/channels.scm.txt | head -n1)
          for _ in $(seq 60); do
            [ "$(git ls-remote "$url" "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA" ] && exit 0
            sleep 10
          done
          echo "the mirror doesn't have $GITHUB_SHA on $GITHUB_REF_NAME after 10 min; trying anyway"

      - name: Build the installer ISO on guix-subs
        run: |
          ci/runner/build-iso-remote.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" ci-payload/qubes-guix-installer.iso
          cp -r dom0 ci-payload/
          cp ci/dom0-tests.sh ci-payload/ 2>/dev/null || true

      - name: Install and test on the Qubes machine
        env:
          SYSTEM_TESTS: ${{ inputs.system_tests }}
        run: ci/runner/qubes-ci-run.sh ci-payload qubes-results

      - name: Keep results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: qubes-results
          path: qubes-results/
